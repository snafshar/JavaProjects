name: NumberQuest checks

on:
  push:
    paths:
      - "games/NumberQuest/**"
      - ".github/workflows/numberquest.yml"
  pull_request:
    paths:
      - "games/NumberQuest/**"
      - ".github/workflows/numberquest.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile game
        working-directory: games/NumberQuest
        run: javac NumberQuest.java
